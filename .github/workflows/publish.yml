name: Publish Extension

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'skip update',    color: 'e4e669', description: 'Merge without publishing a new version to the Marketplace' },
              { name: 'minor release',  color: '0075ca', description: 'Bump minor version on publish (x.Y.0)' },
              { name: 'major release',  color: 'd93f0b', description: 'Bump major version on publish (X.0.0)' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
                }
              }
            }

      - name: Detect release type from merged PR labels
        id: check-skip
        uses: actions/github-script@v7
        with:
          script: |
            // Skip if commit message carries [skip release] (e.g. the version-bump commit itself)
            const msg = context.payload.head_commit?.message ?? '';
            if (msg.includes('[skip release]')) {
              core.setOutput('skip', 'true');
              core.setOutput('bump', 'patch');
              core.info('Skipping: commit message contains [skip release]');
              return;
            }

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const labels = prs.flatMap(pr => pr.labels.map(l => l.name));

            if (labels.includes('skip update')) {
              core.setOutput('skip', 'true');
              core.setOutput('bump', 'patch');
              core.info('Skipping: merged PR has the "skip update" label');
              return;
            }

            const bump = labels.includes('major release') ? 'major'
                       : labels.includes('minor release') ? 'minor'
                       : 'patch';

            core.setOutput('skip', 'false');
            core.setOutput('bump', bump);
            core.info(`Bump type: ${bump}`);

      - name: Setup Node.js
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Install dependencies
        if: steps.check-skip.outputs.skip != 'true'
        run: npm ci

      - name: Build sidecar
        if: steps.check-skip.outputs.skip != 'true'
        run: dotnet publish sidecar/ServiceBusEmulatorSidecar.csproj -c Release -o sidecar/bin

      - name: Bump version
        if: steps.check-skip.outputs.skip != 'true'
        id: version
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          npm version ${{ steps.check-skip.outputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package extension
        if: steps.check-skip.outputs.skip != 'true'
        run: |
          npm run build:extension
          npx @vscode/vsce package --no-dependencies -o servicebus-emulator-explorer-${{ steps.version.outputs.version }}.vsix

      - name: Publish to VS Code Marketplace
        if: steps.check-skip.outputs.skip != 'true'
        run: npx @vscode/vsce publish --no-dependencies --pat ${{ secrets.VSCE_PAT }} --packagePath servicebus-emulator-explorer-${{ steps.version.outputs.version }}.vsix

      - name: Commit and push version bump
        if: steps.check-skip.outputs.skip != 'true'
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip release]"
          git push

      - name: Create GitHub Release
        if: steps.check-skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: servicebus-emulator-explorer-${{ steps.version.outputs.version }}.vsix
